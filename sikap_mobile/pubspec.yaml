name: sikap_mobile
description: L-Keu Darur Rohman - Sistem Informasi Keuangan & Pelaporan Pondok Pesantren
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Backend
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3

  # Routing
  go_router: ^14.0.0

  # Charts
  fl_chart: ^0.68.0

  # Fonts & Icons
  google_fonts: ^6.2.1
  iconsax_flutter: ^1.0.1

  # PDF & Export
  pdf: ^3.11.1
  printing: ^5.13.2

  # Excel Export
  excel: ^4.0.6

  # Utilities
  intl: ^0.19.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  gap: ^3.0.1
  path_provider: ^2.1.3
  share_plus: ^10.0.2
  permission_handler: ^11.3.1
  flutter_dotenv: ^6.0.1
  logger: ^2.7.0
  currency_text_input_formatter: ^2.3.2
  local_auth: ^3.0.2
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.2.1
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^22.3.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/logo/
    - .env

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/logo/logofix.png"
  min_sdk_size: 21
  web:
    generate: true
    image_path: "assets/logo/logofix.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
